on:
  pull_request:
  push:
    branches:
      - 'rigel-release'
name: Test Golang
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Install Go
      uses: actions/setup-go@v2
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Test
      run: go test ./...
  CI:
    needs: [test]
    # A skipped required check counts as passing, so always run and fail on a non-success test.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - run: test "${{ needs.test.result }}" = success
